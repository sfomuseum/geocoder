	<title>Who's On First coarse geocoder</title>

	<div class="container">

		    <a class="navbar-brand" href="#">Geocoder</a>
		    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		    </button>
		    <div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">

			<form class="d-flex" role="search">
			    <input class="form-control me-2" type="search" placeholder="Search for Who's On First places" id="query" name="query" aria-label="Search"/>
			    <button class="btn btn-outline-success" type="submit" id="query-submit">Search</button>
			</form>
		    </div>
		</div>

	    <div id="map" class=""></div>
	    <div id="advanced">
		<details id="advanced-details">
		    <summary>Advanced</summary>
		    <form class="form" id="advanced-form">

			<div class="mb-3">
			    <label for="advanced-query" class="form-label">Query string (required)</label>
			    <input type="text" class="form-control" id="advanced-query" placeholder="Query string">
			</div>

			<div class="mb-3" id="advanced-query-embeddings-wrapper">
			    <input type="checkbox" class="form-check-input" id="advanced-query-embeddings" />			    
			    <label for="advanced-query-embeddings" class="form-check-label">Query with vector embeddings</label>
			</div>
			
			<div class="mb-3">
			    <label for="advanced-placetype" class="form-label">Placetype</label>
			    <input type="text" class="form-control" id="advanced-placetype" placeholder="Comma-separated list of placetypes">
			</div>

			<div class="mb-3">
			    <label for="advanced-country" class="form-label">Country</label>
			    <input type="text" class="form-control" id="advanced-country" placeholder="Comma-separated list of 2-letter country codes">
			</div>

			<div class="mb-3">
			    <label for="advanced-belongsto" class="form-label">Belongs to</label>
			    <input type="text" class="form-control" id="advanced-belongsto" placeholder="Comma-separated list of WOF IDs">
			</div>			

			<div class="mb-3">
			    <label for="advanced-lang" class="form-label">Language</label>
			    <input type="text" class="form-control" id="advanced-lang" placeholder="3-letter language code">
			</div>

			<div class="mb-3">
			    <label for="advanced-tag" class="form-label">Language <q>tag</q></label>
			    <input type="text" class="form-control" id="advanced-tag" placeholder="Who's On First language classifier">
			</div>
			
			
			<button class="btn btn-primary" type="submit" id="advanced-submit" disabled="disabled">Search</button>
		    </form>
		    </details>
	    </div>
	    <div id="feedback" class=""></div>	    
	    <div id="results" class=""></div>
	</div>
	<footer></footer>
    </body>    
    <script type="text/javascript" src="javascript/bootstrap.5.3.8.bundle.min.js"></script>
